<!DOCTYPE html>
<html>
<head>
    <title>User Information Form</title>
    <style>
        /* The CSS Internal Style Sheet */
        body {
            background-color: #1a1a1b; /* Deep charcoal */
            color: #d7dadc;           /* Soft light gray */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        h2 {
            color: #ffffff;
            border-bottom: 2px solid #343536;
            padding-bottom: 10px;
        }

        table {
            background-color: #272729; /* Slightly lighter box */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        td {
            padding: 10px;
        }

        label {
            font-weight: bold;
            color: #818384; /* Muted label color */
        }

        input[type="text"], 
        input[type="number"], 
        select {
            background-color: #343536;
            border: 1px solid #474748;
            color: white;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }

        button[type="submit"] {
            background-color: #d7dadc;
            color: #1a1a1b;
        }

        button[type="submit"]:hover {
            background-color: #ffffff;
        }

        button[type="reset"] {
            background-color: transparent;
            color: #818384;
            text-decoration: underline;
        }

        button[type="reset"]:hover {
            color: #d7dadc;
        }
    </style>
</head>

<body>

    <h2>User Information Form</h2>

    <form action="" method="post">
        <table border="0">
            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="firstname" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lastname" required></td>
            </tr>
            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" id="age" name="age"></td>
            </tr>
            <tr>
                <td valign="top"><label>Gender:</label></td>
                <td>
                    <input type="radio" id="male" name="gender" value="male"> <label for="male" style="font-weight: normal;">Male</label>
                    <input type="radio" id="female" name="gender" value="female"> <label for="female" style="font-weight: normal;">Female</label>
                    <input type="radio" id="other" name="gender" value="other"> <label for="other" style="font-weight: normal;">Other</label>
                </td>
            </tr>
            <tr>
                <td valign="top"><label>Hobbies:</label></td>
                <td style="color: #d7dadc;">
                    <input type="checkbox" id="hobby1" name="hobby" value="reading"> <label for="hobby1" style="font-weight: normal;">Reading</label><br>
                    <input type="checkbox" id="hobby2" name="hobby" value="traveling"> <label for="hobby2" style="font-weight: normal;">Traveling</label><br>
                    <input type="checkbox" id="hobby3" name="hobby" value="gaming"> <label for="hobby3" style="font-weight: normal;">Gaming</label><br>
                    <input type="checkbox" id="hobby4" name="hobby" value="cooking"> <label for="hobby4" style="font-weight: normal;">Cooking</label><br>
                    <input type="checkbox" id="hobby5" name="hobby" value="sports"> <label for="hobby5" style="font-weight: normal;">Sports</label>
                </td>
            </tr>
            <tr>
                <td><label for="year-level">Year Level:</label></td>
                <td>
                    <select id="year-level" name="year_level">
                        <option value="1st-year">1st Year</option>
                        <option value="2nd-year">2nd Year</option>
                        <option value="3rd-year">3rd Year</option>
                        <option value="4th-year">4th Year</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button type="submit">Submit</button>
                    <button type="reset">Clear</button>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
